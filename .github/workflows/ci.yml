# Intégration continue — à chaque push et pull request :
#  1. le backend doit compiler ;
#  2. les tests doivent passer (base MongoDB en mémoire, aucun service externe).
#
# C'est le filet de sécurité du chantier SaaS : aucune modification ne part
# en production sans que les parcours critiques (vente, stock…) aient été
# rejoués automatiquement.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — build + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances
        run: npm ci --include=dev --ignore-scripts

      - name: Compiler
        run: npm run build

      # Binaire mongod de mongodb-memory-server (~80 Mo) : mis en cache pour
      # éviter de le retélécharger à chaque exécution.
      - name: Cache du binaire MongoDB
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Tests
        run: npm test
        env:
          MONGOMS_DOWNLOAD_DIR: ~/.cache/mongodb-binaries

  # Le frontend n'a pas encore de tests : on vérifie au moins qu'il compile.
  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler
        run: npm run build
