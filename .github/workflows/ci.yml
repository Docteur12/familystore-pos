# Intégration continue — à chaque push et pull request :
#  1. le backend doit compiler ;
#  2. les tests backend doivent passer (base MongoDB en mémoire, aucun service externe) ;
#  3. le frontend doit compiler ET passer ses tests — dont les gouvernances qui
#     lisent les sources des deux côtés (modules, motifs de stock, marque,
#     stockage cloisonné) ;
#  4. sur une branche de profil `feat/cameleon-*`, le PÉRIMÈTRE est vérifié :
#     fichiers propres seulement avant le signal, ajouts seulement dans les
#     partagés après, aucun test préexistant modifié (CAMELEON-GAMME.md §2.1).
#
# C'est le filet de sécurité du chantier SaaS : aucune modification ne part
# en production sans que les parcours critiques (vente, stock…) aient été
# rejoués automatiquement.
name: CI

on:
  push:
    # `integration/cameleon` est validée en continu, au même titre que `main`.
    # Sans cette ligne, une branche d'intégration ne passait la CI qu'au
    # moment d'ouvrir une pull request vers `main` — c'est-à-dire au pire
    # moment : plusieurs lots accumulés, et le chantier déjà à un clic du
    # déploiement. Une branche qui reçoit des semaines de travail doit dire
    # tout de suite si elle est verte.
    #
    # Les branches de profil de la gamme (`feat/cameleon-*`) le sont aussi :
    # quatre sessions travaillent en parallèle, chacune doit savoir tout de
    # suite si elle a débordé de son périmètre ou cassé Commerce.
    branches: [main, integration/cameleon, 'feat/cameleon-*']
  pull_request:

jobs:
  backend:
    name: Backend — build + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances
        run: npm ci --include=dev --ignore-scripts

      - name: Compiler
        run: npm run build

      # Binaire mongod de mongodb-memory-server (~80 Mo) : mis en cache pour
      # éviter de le retélécharger à chaque exécution.
      # CHEMIN ABSOLU, et le MÊME des deux côtés.
      #
      # C'était `~/.cache/mongodb-binaries` ici et dans MONGOMS_DOWNLOAD_DIR.
      # `actions/cache` résout le `~` ; une valeur de `env:` est transmise
      # TELLE QUELLE au processus, et Node ne l'interprète pas — il créait donc
      # un dossier littéralement nommé « ~ » dans `backend/`. Les deux ne
      # désignaient pas le même endroit : le cache n'a jamais servi, comme le
      # disait « Cache not found for input keys » à chaque exécution.
      - name: Cache du binaire MongoDB
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-7.0.24

      # TÉLÉCHARGEMENT EN UN SEUL PROCESSUS, avant Jest.
      #
      # Sans cache, chaque worker Jest téléchargeait le binaire en parallèle
      # dans le même dossier vide : le premier renommait le fichier, les autres
      # échouaient en « ENOENT … .tgz.downloading -> .tgz » et treize tests
      # tombaient d'un coup (26/08/2026). Le récupérer d'abord, une fois,
      # supprime la course — et le cache rend l'étape quasi gratuite ensuite.
      - name: Pré-télécharger MongoDB (évite la course entre workers Jest)
        run: node -e "require('mongodb-memory-server').MongoMemoryServer.create().then(s => s.stop())"
        env:
          MONGOMS_DOWNLOAD_DIR: ${{ runner.temp }}/mongodb-binaries

      - name: Tests
        run: npm test
        env:
          MONGOMS_DOWNLOAD_DIR: ${{ runner.temp }}/mongodb-binaries

  # Build ET tests. Le commentaire « le frontend n'a pas encore de tests »
  # était périmé : dix-sept fichiers Vitest, dont six gouvernances — quatre
  # d'entre elles lisent les sources BACKEND pour vérifier des miroirs
  # (modules, motifs de stock, moyens de règlement, marque). Sans cette étape,
  # elles ne protégeaient personne en CI (constat du 11/09/2026).
  frontend:
    name: Frontend — build + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler
        run: npm run build

      - name: Tests
        run: npm test

  # Périmètre des sessions parallèles — branches de profil et PR vers
  # integration/cameleon uniquement. Le script lit cameleon-perimetres.json,
  # déduit le profil du nom de la branche, et échoue sur tout fichier hors
  # périmètre, toute ligne supprimée dans un partagé, tout test préexistant
  # modifié. Sur une branche qui n'est pas un profil, il ne fait rien.
  perimetre:
    name: Périmètre — sessions parallèles
    if: startsWith(github.head_ref || github.ref_name, 'feat/cameleon-')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # le merge-base avec integration/cameleon a besoin de l'historique

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances
        run: npm ci --include=dev --ignore-scripts

      - name: Récupérer la branche de base
        run: git fetch origin integration/cameleon:refs/remotes/origin/integration/cameleon

      - name: Vérifier le périmètre
        run: npm run verifier:perimetre
