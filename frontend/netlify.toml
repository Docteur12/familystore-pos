[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

# Les redirections (proxy /api → backend Render, fallback SPA) sont générées
# dans dist/_redirects au moment du build, à partir de VITE_API_URL — voir
# vite.config.ts (plugin netlify-redirects). Chaque site Netlify (Family Store,
# Radiance…) surcharge VITE_API_URL et les VITE_APP_* dans ses variables
# d'environnement ; les valeurs par défaut (Family Store) sont dans
# .env.production.
